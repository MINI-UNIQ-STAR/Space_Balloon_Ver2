version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: space-balloon-dev
    volumes:
      - .:/workspace
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/bus/usb:/dev/bus/usb
    stdin_open: true
    tty: true
    working_dir: /workspace
