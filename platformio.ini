; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32G431CB
src_dir = Core/Src
include_dir = Core/Inc

[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = stm32cube
build_flags =
	-DBAT_DIVIDER_NUM=2
	-DBAT_DIVIDER_DEN=1

; Ground-debug build: enables SWD-only debug probe globals (Watch/Live Expressions).
; Default env stays flight-safe (probe disabled).
[env:genericSTM32G431CB_debug]
platform = ststm32
board = genericSTM32G431CB
framework = stm32cube
build_flags =
	-DBAT_DIVIDER_NUM=2
	-DBAT_DIVIDER_DEN=1
	-DSWD_DEBUG_PROBE_ENABLE=1

[env:native_test]
platform = native
test_framework = unity
test_build_src = true
build_flags =
	-ICore/Inc

build_src_filter =
	-<*>
	+<services/telemetry_frame.c>
	+<services/nmea_parser.c>
	+<drivers/pms_parser.c>
	+<drivers/sht31_codec.c>
	+<drivers/ms5611_codec.c>
