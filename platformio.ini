; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32G431CB
src_dir = Core/Src
include_dir = Core/Inc

[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
extra_scripts = pre:platformio_build.py
build_unflags = -mfpu=fpv5-sp-d16
build_flags =
	-DBAT_DIVIDER_NUM=2
	-DBAT_DIVIDER_DEN=1
	-DMS5611_SERVICE_OSR=MS5611_OSR_4096
	-DUSE_HAL_DRIVER
	-DSTM32G431xx
	-DSTM32_THREAD_SAFE_STRATEGY=4
	-IMiddlewares/Third_Party/FreeRTOS/Source/include
	-IMiddlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
	-IMiddlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
board_build.ldscript = STM32G431CBUx_FLASH.ld
build_src_filter =
	+<*>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/*.c>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/*.c>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/*.c>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>

; Ground-debug build: enables SWD-only debug probe globals (Watch/Live Expressions).
; Default env stays flight-safe (probe disabled).
[env:genericSTM32G431CB_debug]
platform = ststm32
board = genericSTM32G431CB
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
extra_scripts = pre:platformio_build.py
build_type = debug
debug_speed = 1800
debug_extra_cmds =
	set remotetimeout 5
	set pagination off
build_unflags = -mfpu=fpv5-sp-d16
build_flags =
	-DBAT_DIVIDER_NUM=2
	-DBAT_DIVIDER_DEN=1
	-DMS5611_SERVICE_OSR=MS5611_OSR_4096
	-DSWD_DEBUG_PROBE_ENABLE=1
	-DUSE_HAL_DRIVER
	-DSTM32G431xx
	-DSTM32_THREAD_SAFE_STRATEGY=4
	-mfpu=fpv4-sp-d16
	-mfloat-abi=hard
	-IMiddlewares/Third_Party/FreeRTOS/Source/include
	-IMiddlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
	-IMiddlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
board_build.ldscript = STM32G431CBUx_FLASH.ld
build_src_filter =
	+<*>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/*.c>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/*.c>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/*.c>
	+<../../Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>

[env:native_test]
platform = native
test_framework = unity
test_build_src = true
build_flags =
	-ICore/Inc

build_src_filter =
	-<*>
	+<services/telemetry_frame.c>
	+<services/nmea_parser.c>
	+<drivers/pms_parser.c>
	+<drivers/sht31_codec.c>
	+<drivers/ms5611_codec.c>
